# Render Blueprint for the Bolt creative engine.
#
# One Web Service. The same process serves the frontend, the Remix loaders and
# the generated-image route; splitting them would only put a network hop
# between a campaign page and its own imagery.
#
# Secrets are NOT in this file. `sync: false` means Render prompts for the
# value once and stores it in the service environment.
services:
  - type: web
    name: ithinq-bolt-renderer
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # `--prod=false` is load-bearing. Render applies the service env vars to the
    # BUILD as well as the runtime, so NODE_ENV=production below makes pnpm skip
    # devDependencies -- and vite, @remix-run/dev (which runs the build) and
    # @remix-run/serve (which runs the start command) all live there. Without it
    # the install dies on the husky `prepare` script and the build could not have
    # run anyway.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && NODE_OPTIONS=--max-old-space-size=8192 pnpm run build
    startCommand: pnpm run start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # Git hooks have no purpose on a build machine, and a failing hook installer
      # should never be able to fail a deploy. husky respects HUSKY=0.
      - key: HUSKY
        value: '0'
      # Required for campaign authorship. Server-side only; never reaches the
      # browser bundle. Without it the engine degrades to the document's own
      # copy and placeholder imagery rather than failing.
      - key: OPENAI_API_KEY
        sync: false
      # Optional. Defaults to https://ithinq.ai. Cannot widen the fact host
      # ceiling, which is closed in code.
      # - key: ITHINQ_WEBSITE_ORIGIN
      #   sync: false
      # Optional. Overrides the approved page list for fact ingestion.
      # - key: ITHINQ_WEBSITE_PATHS
      #   sync: false
      #
      # DURABLE ASSET STORAGE. Pick exactly one of the two options below.
      #
      # Option A - object store (S3, R2, B2, MinIO). Survives a redeploy AND a
      # second instance, so it is the one that does not have to be revisited.
      # All four are required together: `resolveAssetStore` refuses a partial
      # configuration rather than silently falling back to ephemeral disk,
      # because the symptom of that fallback is imagery vanishing on deploy.
      # - key: RENDERER_ASSET_S3_ENDPOINT
      #   sync: false
      # - key: RENDERER_ASSET_S3_BUCKET
      #   sync: false
      # - key: RENDERER_ASSET_S3_ACCESS_KEY_ID
      #   sync: false
      # - key: RENDERER_ASSET_S3_SECRET_ACCESS_KEY
      #   sync: false
      # Optional. `auto` for R2 and MinIO; a real region for S3.
      # - key: RENDERER_ASSET_S3_REGION
      #   value: auto
      # - key: RENDERER_ASSET_S3_PREFIX
      #   value: ithinq-generated/
      #
      # Option B - a Render persistent disk. Simpler, but it pins the service to
      # one instance forever. Uncomment the `disk:` block below and point this
      # at the same mount; no code path changes, FileSystemAssetStore is already
      # durable once it is writing to a disk that persists.
      # - key: RENDERER_ASSET_DIR
      #   value: /var/ithinq-data/generated
      #
      # Campaign job queue. Defaults are 2 / 8 / 300000 / 1800000. Concurrency
      # is a spend and rate-limit bound before it is a CPU one: each job is a
      # gpt-4o interpretation, an authoring pass, a claim audit and up to two
      # gpt-image-1 renders.
      # - key: RENDERER_CAMPAIGN_CONCURRENCY
      #   value: '2'
      # - key: RENDERER_CAMPAIGN_QUEUE_LIMIT
      #   value: '8'
      # - key: RENDERER_CAMPAIGN_TIMEOUT_MS
      #   value: '300000'
      # - key: RENDERER_CAMPAIGN_RESULT_TTL_MS
      #   value: '1800000'
    # Option B, second half. A disk makes `.data/` survive a redeploy but binds
    # the service to a single instance; the object store above does not.
    # disk:
    #   name: ithinq-data
    #   mountPath: /var/ithinq-data
    #   sizeGB: 5
#
# STORAGE, as deployed today: no disk and no object store are configured, so
# generated imagery and the website fact snapshot live under `.data/` on the
# instance filesystem and do not survive a redeploy. Imagery regenerates on the
# next request (at real gpt-image-1 cost) and the snapshot is rebuilt with
# `pnpm ithinq:refresh-facts`. Acceptable for smoke testing; NOT acceptable for
# Partner-facing pages, which must keep the same imagery across deploys. The
# code no longer blocks that — set Option A or Option B above and redeploy.
#
# CAMPAIGN JOBS: authoring runs off the request thread. `POST
# /ithinq/campaign-jobs` returns a job id immediately, `GET
# /ithinq/campaign-jobs/:id` reports progress, and
# `/ithinq/campaign-preview?job=<id>` renders the finished page. Job records
# live in the process, which is complete for one web service and would need a
# shared record store before a second instance.
